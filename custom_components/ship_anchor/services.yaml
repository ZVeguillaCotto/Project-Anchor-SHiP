compile:
  name: Compile Offline Bindings
  description: Compiles Home Assistant automations into native hardware bindings and local SHiP fast-path rules. Pass automation_ids to scan saved automations, or pass protocol/source_ieee/targets directly to compile a single binding.
  fields:
    dry_run:
      name: Dry Run
      description: When true, previews generated payloads in logs without sending commands to hardware.
      example: true
      required: false
      selector:
        boolean:
    automation_ids:
      name: Automation IDs
      description: Automation ID(s) to compile, comma-separated. Leave empty to compile every eligible automation in automations.yaml.
      example: kitchen_button_light
      required: false
      selector:
        text:
    source_node_id:
      name: Source Node ID
      description: Matter or Z-Wave node ID of the source device (used with protocol MATTER or ZWAVE).
      example: 5
      required: false
      selector:
        number:
          min: 1
    protocol:
      name: Protocol
      description: Target smart home protocol to compile for.
      example: ZIGBEE_ZHA
      required: false
      selector:
        text:
    source_ieee:
      name: Source IEEE Address
      description: IEEE MAC address of the source switch or button.
      example: "00:0d:6f:00:05:7d:2d:34"
      required: false
      selector:
        text:
    source_model:
      name: Source Model
      description: Model identifier for quirk and pre-flight auto-discovery.
      example: "VZM31-SN"
      required: false
      selector:
        text:
    targets:
      name: Targets
      description: List of target devices (bulbs, valves, locks).
      required: false
      selector:
        object:

erase_all:
  name: Erase All Offline Bindings
  description: Removes all previously programmed offline hardware bindings and resets configurations.
